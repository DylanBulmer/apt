[workspace]
resolver = "3"
members = [
    "crates/mc-common",
    "crates/mc",
    "crates/mc-rcon",
    "crates/mc-backup",
    "crates/mc-mrpack",
]

# Every crate here ships in a .deb whose Version: comes from its own
# DEBIAN/control, not from cargo. These are kept in step with each other so a
# `cargo` version is never mistaken for a package version, but control is the
# authority — see CLAUDE.md on why an unbumped Version: never reaches installed
# systems.
[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/dbulmer/apt.bulmer.dev"
authors = ["Dylan Bulmer <dylan@bulmer.dev>"]

[workspace.dependencies]
mc-common = { path = "crates/mc-common" }

serde = { version = "1", features = ["derive"] }
toml = "0.9"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# The security-relevant paths in this tree all validate before use and return
# errors rather than aborting. A panic in a maintainer script or in
# `mc serve` (systemd's ExecStart=) is an outage with no legible cause, so the
# usual "just unwrap it" shortcuts are denied rather than left to review.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

# The release profile these .debs ship from. Symbols are kept: a stripped binary
# turns a crash report in the journal into an address with no name, and these
# run unattended on other people's servers.
[profile.release]
strip = false
debug = 1
