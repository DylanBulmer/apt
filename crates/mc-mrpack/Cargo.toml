[package]
name = "mc-mrpack"
description = "Modrinth modpack source provider for the mc Minecraft server manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# → /usr/libexec/mc/mc-mrpack. Keep the name in step with scripts/build.sh.
[[bin]]
name = "mc-mrpack"
path = "src/main.rs"

[dependencies]
mc-common = { workspace = true }
serde = { workspace = true }
serde_json = "1"
# `deflate` only: a .mrpack is a plain zip, and every extra codec is another
# decompressor reached by attacker-controlled input.
zip = { version = "6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
