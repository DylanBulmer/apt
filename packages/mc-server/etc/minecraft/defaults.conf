# mc global defaults — values here are overridden by /etc/minecraft/server.conf

# Default server type for new installs (vanilla, paper, fabric, neoforge)
DEFAULT_SERVER_TYPE="vanilla"

# Minecraft version for new installs ("latest" or a specific version, e.g. "26.2").
# Resolved to a concrete version and pinned in server.conf at install time.
MINECRAFT_VERSION="latest"

# Java major version to launch the server with (e.g. 25) — leave empty to
# auto-select based on the Minecraft version being installed.
JAVA_VERSION=""

# Default RAM allocation
SERVER_RAM="4G"

# JVM flags — leave empty to auto-configure based on Java version.
#   Java 21+  → Generational ZGC  (sub-millisecond pauses, recommended)
#   Java 17   → Aikar's G1GC tuning (~200ms pause target)
SERVER_FLAGS=""

# Extra JVM options (e.g. -Dfile.encoding=UTF-8)
JAVA_OPTS=""

# Game server port for NEW installs (RCON is seeded at this port + 10).
#
# Once a server exists, /opt/minecraft/server.properties is the source of truth:
# server-port and rcon.port there are what the server binds, and mc reads them
# back rather than assuming this value still applies. Change the port on a live
# server by editing server.properties — mc picks it up and rewrites SERVER_PORT
# in server.conf to match on the next command that saves config.
SERVER_PORT="25565"

# Number of backup archives to retain
BACKUP_KEEP=7

# Backup schedule (systemd OnCalendar= syntax — e.g. weekly, daily, "Mon *-*-* 02:00:00")
BACKUP_SCHEDULE="daily"
